<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donate - Freedom Party</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1f3a;
      color: white;
      text-align: center;
    }

    .flag-left, .flag-right {
      position: fixed;
      top: 0;
      width: 80px;
      height: 100%;
      background-image: url('https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg');
      background-size: cover;
      opacity: 0.08;
      z-index: -1;
    }

    .flag-left { left: 0; }
    .flag-right { right: 0; }

    header {
      background: #d32f2f;
      padding: 20px;
      animation: fadeDown 1s ease;
    }

    .container {
      padding: 50px;
      animation: fadeUp 1.2s ease;
    }

    .card {
      background: #13294b;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      margin: 10px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ff5252;
      box-shadow: 0 0 12px #ff5252;
      transform: scale(1.05);
    }

    a {
      display: block;
      margin-top: 20px;
      color: white;
      text-decoration: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="flag-left"></div>
<div class="flag-right"></div>

<header>
  <img src="logo.png" style="width:120px; display:block; margin:0 auto 10px;">
  <h1>Support the Freedom Party</h1>
</header>

<div class="container">
  <div class="card">
    <h2>Make a Donation</h2>
    <p>Your support helps our campaign grow.</p>

    <button onclick="donate()">Donate $10</button>
    <button onclick="donate()">Donate $25</button>
    <button onclick="donate()">Donate $50</button>

    <p id="msg"></p>

    <a href="./index.html">← Back to Home</a>
  </div>
</div>

<script>
function donate() {
  document.getElementById("msg").innerHTML =
    "✅ Thank you! (This is unfortunately not real)";
}
</script>

</body>
</html>
